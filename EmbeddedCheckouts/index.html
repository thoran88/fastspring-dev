<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout &mdash; Odyssey</title>
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var theme =
          stored ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      :root {
        --bg: #f6f7fb;
        --surface: #ffffff;
        --surface-2: #fbfaff;
        --border: #e4e3f5;
        --text: #14121f;
        --text-muted: #5c5a72;
        --text-faint: #8b8aa0;
        --accent-1: #6d28d9;
        --accent-2: #db2777;
        --accent-solid: #6d28d9;
        --success: #0f9d58;
        --success-soft: #e6f6ec;
        --shadow-md: 0 8px 24px rgba(30, 20, 60, 0.08);
        --radius: 16px;
      }

      :root[data-theme="dark"] {
        --bg: #08070d;
        --surface: #131120;
        --surface-2: #17142a;
        --border: #2a2643;
        --text: #f2f1fb;
        --text-muted: #a9a6c4;
        --text-faint: #716e94;
        --accent-1: #a78bfa;
        --accent-2: #f472b6;
        --accent-solid: #a78bfa;
        --success: #34d399;
        --success-soft: #103224;
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.55 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
      }

      /* ---------- top bar ---------- */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text-muted);
        text-decoration: none;
      }
      .back-link:hover {
        color: var(--text);
      }
      .back-link svg {
        width: 14px;
        height: 14px;
      }

      .top-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .env-badge {
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        padding: 5px 10px;
        border-radius: 999px;
        background: var(--success-soft);
        color: var(--success);
        white-space: nowrap;
      }

      .theme-toggle {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .theme-toggle:hover {
        border-color: var(--accent-solid);
        color: var(--accent-solid);
      }
      .theme-toggle svg {
        width: 15px;
        height: 15px;
      }
      .theme-toggle .icon-sun,
      .theme-toggle .icon-moon {
        display: none;
      }
      :root[data-theme="light"] .theme-toggle .icon-moon {
        display: block;
      }
      :root[data-theme="dark"] .theme-toggle .icon-sun {
        display: block;
      }

      /* ---------- layout ---------- */
      /* FastSpring's embedded checkout iframe renders at its own fixed
         width regardless of the container's CSS, so the right side needs
         to be wide open rather than squeezed into a 50/50 split - a
         narrow fixed sidebar for the summary, generous flexible space
         for payment. */
      .checkout {
        max-width: 1400px;
        margin: 0 auto;
        padding: 40px 32px 80px;
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 40px;
        align-items: start;
      }

      @media (max-width: 1180px) {
        .checkout {
          grid-template-columns: 1fr;
          padding: 24px 16px 56px;
        }
      }

      .panel-label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-faint);
        margin: 0 0 16px;
      }

      /* ---------- left: order summary ---------- */
      .summary-card {
        position: sticky;
        top: 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 26px;
        box-shadow: var(--shadow-md);
      }

      @media (max-width: 1180px) {
        .summary-card {
          position: static;
        }
      }

      .product-row {
        display: flex;
        gap: 16px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }

      .product-thumb {
        width: 84px;
        height: 112px;
        object-fit: cover;
        border-radius: 10px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        flex-shrink: 0;
      }

      .product-info {
        flex-grow: 1;
        min-width: 0;
      }

      .product-title {
        font-size: 16px;
        font-weight: 700;
        margin: 0 0 6px;
      }

      .product-desc {
        font-size: 13px;
        color: var(--text-muted);
        margin: 0 0 10px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .product-meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-size: 13px;
        color: var(--text-faint);
      }

      .product-item-total {
        font-weight: 700;
        color: var(--text);
        font-size: 14px;
      }

      .breakdown {
        padding: 20px 0;
        border-bottom: 1px solid var(--border);
      }

      .breakdown-row {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: var(--text-muted);
        padding: 5px 0;
      }

      .breakdown-row.total {
        margin-top: 8px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
        font-size: 17px;
        font-weight: 800;
        color: var(--text);
      }

      .trust-list {
        padding-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .trust-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--text-muted);
      }

      .trust-item svg {
        width: 15px;
        height: 15px;
        color: var(--accent-solid);
        flex-shrink: 0;
      }

      /* ---------- right: payment ---------- */
      .payment-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 26px;
        box-shadow: var(--shadow-md);
      }

      .payment-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .payment-head h2 {
        font-size: 16px;
        margin: 0;
        font-weight: 700;
      }

      .lock-note {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--text-faint);
      }
      .lock-note svg {
        width: 13px;
        height: 13px;
      }

      #fsc-embedded-checkout-container {
        position: relative;
        min-height: 420px;
        width: 100%;
        overflow: hidden;
      }

      .payment-placeholder {
        min-height: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: var(--text-faint);
        font-size: 13px;
        text-align: center;
        padding: 24px;
      }

      .proceed-btn {
        font-size: 14px;
        font-weight: 700;
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        background: var(--accent-solid);
        color: #fff;
        cursor: pointer;
      }
      .proceed-btn:hover {
        opacity: 0.9;
      }

      .quiz-question {
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
        margin: 0;
      }

      .quiz-options {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }

      .quiz-btn {
        font-size: 13px;
        font-weight: 600;
        padding: 9px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--text);
        cursor: pointer;
      }
      .quiz-btn:hover {
        border-color: var(--accent-solid);
        color: var(--accent-solid);
      }
      .quiz-btn.is-wrong {
        border-color: var(--accent-2);
        color: var(--accent-2);
      }

      .quiz-feedback {
        min-height: 16px;
        font-size: 12.5px;
        color: var(--accent-2);
        margin: 0;
      }

      .spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2.5px solid var(--border);
        border-top-color: var(--accent-solid);
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a class="back-link" href="../index.html">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        All demos
      </a>
      <div class="top-controls">
        <button
          class="theme-toggle"
          id="theme-toggle"
          type="button"
          aria-label="Toggle color theme"
        >
          <svg
            class="icon-sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
            />
          </svg>
          <svg
            class="icon-moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
          </svg>
        </button>
      </div>
    </div>

    <div class="checkout">
      <!-- Left: order summary, populated live via FastSpring SBL directives -->
      <div>
        <p class="panel-label">Order Summary</p>
        <div class="summary-card">
          <div class="product-row">
            <img
              class="product-thumb"
              data-fsc-item-path="odyssey"
              data-fsc-item-image
            />
            <div class="product-info">
              <p
                class="product-title"
                data-fsc-item-path="odyssey"
                data-fsc-item-display
              ></p>
              <p
                class="product-desc"
                data-fsc-item-path="odyssey"
                data-fsc-item-description-summary
              ></p>
              <div class="product-meta">
                <span
                  >Qty
                  <span
                    data-fsc-item-path="odyssey"
                    data-fsc-item-quantity
                  ></span>
                  &middot;
                  <span data-fsc-item-path="odyssey" data-fsc-item-price></span>
                  each</span
                >
              </div>
            </div>
          </div>

          <div class="breakdown">
            <div class="breakdown-row">
              <span>Total</span>
              <span
                data-fsc-item-priceTotal
                data-fsc-item-path="odyssey"
              ></span>
            </div>
            <div class="breakdown-row">
              <span>Discount total</span>
              <span data-fsc-item-path="odyssey" data-fsc-item-discountTotal>
                <!-- The item's total discount amount will populate here -->
              </span>
            </div>

            <div class="breakdown-row total">
              <span>Total</span>
              <span
                class="product-item-total"
                data-fsc-item-path="odyssey"
                data-fsc-item-total
              ></span>
            </div>
          </div>

          <div class="trust-list">
            <span class="trust-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z" />
              </svg>
              Instant digital delivery after purchase
            </span>
          </div>
        </div>
      </div>

      <!-- Right: payment component, rendered by FastSpring into the container below -->
      <div>
        <p class="panel-label">Payment Details</p>
        <div class="payment-card">
          <div class="payment-head">
            <h2>Pay with card</h2>
            <span class="lock-note">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="11" width="18" height="10" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              Encrypted
            </span>
          </div>

          <div id="fsc-embedded-checkout-container">
            <div class="payment-placeholder" id="payment-placeholder">
              <p class="quiz-question">
                Get this question right to proceed to payment: who is the
                protagonist of the Odyssey?
              </p>
              <div class="quiz-options" id="quiz-options">
                <button class="quiz-btn" data-correct="false">Achilles</button>
                <button class="quiz-btn" data-correct="true">Odysseus</button>
                <button class="quiz-btn" data-correct="false">Hector</button>
                <button class="quiz-btn" data-correct="false">Agamemnon</button>
              </div>
              <p class="quiz-feedback" id="quiz-feedback"></p>
            </div>
            <iframe
              id="fsc-embedded-checkout-skeleton-custom"
              name="fsc-embedded-checkout-skeleton-custom"
              width="0"
              height="0"
              style="display: none"
              src="https://sbl.onfastspring.com/sbl/1.0.5/skeleton.html"
            ></iframe>
          </div>
        </div>
      </div>
    </div>

    <script
      id="fsc-api"
      src="https://d1f8f9xcsvx3ha.cloudfront.net/sbl/TNP-27957/fastspring-builder.js"
      type="text/javascript"
      data-storefront="thoran.test.qa.onfastspring.com/embedded-cards"
    ></script>

    <script>
      (function () {
        var btn = document.getElementById("theme-toggle");
        if (!btn) return;
        btn.addEventListener("click", function () {
          var current = document.documentElement.getAttribute("data-theme");
          var next = current === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          localStorage.setItem("theme", next);
        });
      })();

      (function () {
        var options = document.getElementById("quiz-options");
        if (!options) return;
        var feedback = document.getElementById("quiz-feedback");

        options.addEventListener("click", function (event) {
          var btn = event.target.closest(".quiz-btn");
          if (!btn) return;

          if (btn.dataset.correct !== "true") {
            btn.classList.add("is-wrong");
            feedback.textContent = "Not quite — try again.";
            return;
          }

          document.getElementById("payment-placeholder").innerHTML =
            '<div class="spinner"></div><span>Loading secure payment form&hellip;</span>';
          fastspring.builder.add("odyssey");
          fastspring.builder.checkout();
        });
      })();
    </script>
  </body>
</html>
